# docker-compose.yml
# ============================================================
# AWX Production Docker Compose
# Services: postgres, redis, awx-web, awx-task, nginx
# ============================================================
version: '3.8'

services:

  # ── PostgreSQL Database ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: awx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-awx}
      POSTGRES_USER:     ${POSTGRES_USER:-awx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      # Persistent database storage
      - postgres_data:/var/lib/postgresql/data
      # Initialization scripts (run once on first start)
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - awx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-awx} -d ${POSTGRES_DB:-awx}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Tune PostgreSQL for AWX workloads
    command: >
      postgres
        -c max_connections=200
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c log_min_duration_statement=1000
        -c timezone=UTC
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis (message broker / cache) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: awx-redis
    restart: unless-stopped
    # Redis config: save to disk, set max memory
    command: >
      redis-server
        --save 60 1000
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - awx-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── AWX Web (Django + nginx inside container) ─────────────────
  awx-web:
    image: quay.io/ansible/awx:${AWX_VERSION:-24.6.1}
    container_name: awx-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    hostname: awxweb
    user: root
    ports:
      - "${AWX_WEB_PORT:-80}:8052"
    environment:
      # Database connection
      DATABASE_HOST:     postgres
      DATABASE_PORT:     "5432"
      DATABASE_NAME:     ${POSTGRES_DB:-awx}
      DATABASE_USER:     ${POSTGRES_USER:-awx}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis connection
      REDIS_HOST:        redis
      REDIS_PORT:        "6379"
      # AWX admin credentials (used on first run only)
      AWX_ADMIN_USER:     ${AWX_ADMIN_USER:-admin}
      AWX_ADMIN_PASSWORD: ${AWX_ADMIN_PASSWORD}
      AWX_ADMIN_EMAIL:    ${AWX_ADMIN_EMAIL:-admin@example.com}
      # Secret key for Django (must be same across web and task)
      SECRET_KEY:        ${SECRET_KEY}
    volumes:
      # AWX settings override
      - ./awx/settings.py:/etc/tower/conf.d/custom.py:ro
      # Persistent project storage (playbooks from SCM)
      - awx_projects:/var/lib/awx/projects
      # Persistent AWX data
      - awx_data:/var/lib/awx
    networks:
      - awx-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8052/api/v2/ping/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── AWX Task (Ansible job runner) ─────────────────────────────
  awx-task:
    image: quay.io/ansible/awx:${AWX_VERSION:-24.6.1}
    container_name: awx-task
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      awx-web:
        condition: service_started
    hostname: awx
    user: root
    environment:
      # Must match awx-web exactly
      DATABASE_HOST:     postgres
      DATABASE_PORT:     "5432"
      DATABASE_NAME:     ${POSTGRES_DB:-awx}
      DATABASE_USER:     ${POSTGRES_USER:-awx}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST:        redis
      REDIS_PORT:        "6379"
      AWX_ADMIN_USER:     ${AWX_ADMIN_USER:-admin}
      AWX_ADMIN_PASSWORD: ${AWX_ADMIN_PASSWORD}
      AWX_ADMIN_EMAIL:    ${AWX_ADMIN_EMAIL:-admin@example.com}
      SECRET_KEY:        ${SECRET_KEY}
      # Mark this container as the task runner
      AWX_COMPONENT:     task
    volumes:
      - ./awx/settings.py:/etc/tower/conf.d/custom.py:ro
      - awx_projects:/var/lib/awx/projects
      - awx_data:/var/lib/awx
    networks:
      - awx-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  # Sits in front of awx-web for SSL termination and proper headers
  nginx:
    image: nginx:alpine
    container_name: awx-nginx
    restart: unless-stopped
    depends_on:
      - awx-web
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/awx.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount SSL certs if using HTTPS (optional)
      # - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - awx-network
    healthcheck:
      test: ["CMD-SHELL", "nginx -t && curl -sf http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ── Volumes ──────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  awx_projects:
    driver: local
  awx_data:
    driver: local

# ── Networks ─────────────────────────────────────────────────────
networks:
  awx-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
