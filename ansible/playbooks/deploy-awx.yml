---
# ansible/playbooks/deploy-awx.yml
# ============================================================
# Playbook to deploy AWX on a target Ubuntu server using
# the scripts in this repository.
# Run this against your Kubernetes control-plane node.
#
# Usage:
#   ansible-playbook -i inventories/dev/hosts.yml deploy-awx.yml \
#     -e environment=dev
# ============================================================
- name: Deploy AWX to Kubernetes
  hosts: k8s_cluster
  gather_facts: true
  become: true

  vars:
    awx_repo_url: "https://github.com/YOUR_ORG/awx-gitops.git"
    awx_repo_dest: "/opt/awx-gitops"
    awx_repo_branch: "main"
    deploy_environment: "{{ environment | default('dev') }}"

  tasks:
    - name: Install git
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true

    - name: Clone or update AWX GitOps repository
      ansible.builtin.git:
        repo: "{{ awx_repo_url }}"
        dest: "{{ awx_repo_dest }}"
        version: "{{ awx_repo_branch }}"
        force: true

    - name: Make scripts executable
      ansible.builtin.file:
        path: "{{ awx_repo_dest }}/scripts/{{ item }}"
        mode: "0755"
      loop:
        - bootstrap.sh
        - deploy.sh
        - generate-secrets.sh
        - healthcheck.sh

    - name: Check if k3s is installed
      ansible.builtin.command: which k3s
      register: k3s_check
      failed_when: false
      changed_when: false

    - name: Bootstrap server (installs k3s + tools) if not already done
      ansible.builtin.command: "{{ awx_repo_dest }}/scripts/bootstrap.sh"
      when: k3s_check.rc != 0
      register: bootstrap_result
      changed_when: bootstrap_result.rc == 0

    - name: Write secrets.env from Ansible vault
      ansible.builtin.template:
        src: secrets.env.j2  # Create this template with vault-encrypted vars
        dest: "{{ awx_repo_dest }}/k8s/overlays/{{ deploy_environment }}/secrets.env"
        mode: "0600"
      no_log: true  # Don't log secrets

    - name: Deploy AWX
      ansible.builtin.command:
        cmd: "{{ awx_repo_dest }}/scripts/deploy.sh {{ deploy_environment }}"
        chdir: "{{ awx_repo_dest }}"
      register: deploy_result
      changed_when: deploy_result.rc == 0

    - name: Display deploy output
      ansible.builtin.debug:
        var: deploy_result.stdout_lines

    - name: Run health check
      ansible.builtin.command:
        cmd: "{{ awx_repo_dest }}/scripts/healthcheck.sh {{ deploy_environment }}"
        chdir: "{{ awx_repo_dest }}"
      register: health_result
      failed_when: health_result.rc != 0
      changed_when: false

    - name: Health check output
      ansible.builtin.debug:
        var: health_result.stdout_lines
