---
# ansible/playbooks/configure-awx.yml
# ============================================================
# Post-deployment AWX configuration playbook.
# Uses the awx.awx collection to configure AWX via API:
#   - Organizations
#   - Credentials
#   - Projects (linked to this GitHub repo)
#   - Inventories
#   - Job Templates
#
# Prerequisites:
#   pip install awxkit
#   ansible-galaxy collection install awx.awx
#
# Usage (local):
#   ansible-playbook configure-awx.yml \
#     -e awx_url=http://localhost:8080 \
#     -e awx_admin_password=YOUR_PASSWORD
# ============================================================
- name: Configure AWX via API
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    awx_url: "http://awx-dev.example.com"   # Override per environment
    awx_username: "admin"
    awx_admin_password: "{{ lookup('env', 'AWX_ADMIN_PASSWORD') }}"
    github_repo_url: "https://github.com/YOUR_ORG/awx-gitops.git"
    organization_name: "Default"

  collections:
    - awx.awx

  tasks:
    - name: Wait for AWX API to be reachable
      ansible.builtin.uri:
        url: "{{ awx_url }}/api/v2/ping/"
        method: GET
        status_code: 200
      register: awx_ping
      retries: 20
      delay: 15
      until: awx_ping.status == 200

    - name: Create organization
      awx.awx.organization:
        name: "{{ organization_name }}"
        description: "Default Organization managed by GitOps"
        state: present
        controller_host: "{{ awx_url }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_admin_password }}"
        validate_certs: false

    - name: Create GitHub Source Control credential
      awx.awx.credential:
        name: "GitHub - awx-gitops"
        organization: "{{ organization_name }}"
        credential_type: "Source Control"
        inputs:
          username: "{{ github_username | default('') }}"
          password: "{{ github_token | default('') }}"
        state: present
        controller_host: "{{ awx_url }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_admin_password }}"
        validate_certs: false
      no_log: true  # Don't log the GitHub token

    - name: Create AWX Project from GitHub
      awx.awx.project:
        name: "AWX GitOps Playbooks"
        description: "Ansible playbooks from {{ github_repo_url }}"
        organization: "{{ organization_name }}"
        scm_type: git
        scm_url: "{{ github_repo_url }}"
        scm_branch: main
        scm_update_on_launch: true
        scm_clean: true
        credential: "GitHub - awx-gitops"
        state: present
        controller_host: "{{ awx_url }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_admin_password }}"
        validate_certs: false
      register: project_result

    - name: Wait for project SCM sync
      awx.awx.project_update:
        project: "AWX GitOps Playbooks"
        organization: "{{ organization_name }}"
        wait: true
        timeout: 120
        controller_host: "{{ awx_url }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_admin_password }}"
        validate_certs: false

    - name: Create Dev inventory
      awx.awx.inventory:
        name: "Dev Inventory"
        description: "Development environment hosts"
        organization: "{{ organization_name }}"
        state: present
        controller_host: "{{ awx_url }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_admin_password }}"
        validate_certs: false

    - name: Create inventory source from SCM
      awx.awx.inventory_source:
        name: "Dev Inventory - SCM"
        inventory: "Dev Inventory"
        source: scm
        source_project: "AWX GitOps Playbooks"
        source_path: "ansible/inventories/dev/hosts.yml"
        update_on_launch: true
        state: present
        controller_host: "{{ awx_url }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_admin_password }}"
        validate_certs: false

    - name: Create Job Template - Site Deploy
      awx.awx.job_template:
        name: "Deploy Site"
        job_type: run
        organization: "{{ organization_name }}"
        inventory: "Dev Inventory"
        project: "AWX GitOps Playbooks"
        playbook: "ansible/playbooks/site.yml"
        ask_inventory_on_launch: true
        ask_limit_on_launch: true
        ask_variables_on_launch: true
        state: present
        controller_host: "{{ awx_url }}"
        controller_username: "{{ awx_username }}"
        controller_password: "{{ awx_admin_password }}"
        validate_certs: false

    - name: AWX configuration complete
      ansible.builtin.debug:
        msg: |
          AWX Configuration complete!
          - Organization: {{ organization_name }}
          - Project: AWX GitOps Playbooks ({{ github_repo_url }})
          - Inventories: Dev Inventory
          - Job Templates: Deploy Site
          
          Login at: {{ awx_url }}
          Username: {{ awx_username }}
