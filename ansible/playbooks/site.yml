---
# Ansible Playbook — Full AWX on Rancher Setup
# Usage:
#   ansible-playbook -i inventories/dev/hosts.yml playbooks/site.yml
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/site.yml

- name: Setup AWX on Rancher
  hosts: awx_servers
  become: true
  gather_facts: true

  vars:
    k3s_version: "stable"
    cert_manager_version: "v1.14.4"
    awx_version: "24.6.1"
    bootstrap_password: "admin"
    awx_admin_email: "admin@example.com"

  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - git
          - openssl
          - python3
          - python3-pip
        state: present

  tasks:

    # ── System tuning ──────────────────────────────────────
    - name: Set vm.overcommit_memory
      sysctl:
        name: vm.overcommit_memory
        value: "1"
        state: present
        reload: true

    # ── k3s ────────────────────────────────────────────────
    - name: Check if k3s is installed
      stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Install k3s
      shell: |
        curl -sfL https://get.k3s.io | \
          INSTALL_K3S_EXEC="server --write-kubeconfig-mode=644" sh -
      when: not k3s_binary.stat.exists

    - name: Set KUBECONFIG in /etc/environment
      lineinfile:
        path: /etc/environment
        line: 'KUBECONFIG=/etc/rancher/k3s/k3s.yaml'
        state: present

    - name: Wait for k3s node to be ready
      shell: kubectl get nodes --no-headers | grep -c Ready
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: node_ready
      retries: 20
      delay: 10
      until: node_ready.stdout | int >= 1

    # ── Helm ───────────────────────────────────────────────
    - name: Check if helm is installed
      stat:
        path: /usr/local/bin/helm
      register: helm_binary

    - name: Install Helm
      shell: curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
      when: not helm_binary.stat.exists

    # ── cert-manager ───────────────────────────────────────
    - name: Install cert-manager CRDs
      shell: |
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/{{ cert_manager_version }}/cert-manager.crds.yaml
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Add jetstack helm repo
      shell: helm repo add jetstack https://charts.jetstack.io --force-update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install cert-manager
      shell: |
        helm upgrade --install cert-manager jetstack/cert-manager \
          --namespace cert-manager \
          --create-namespace \
          --version {{ cert_manager_version }}
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    # ── Rancher ────────────────────────────────────────────
    - name: Add Rancher helm repo
      shell: helm repo add rancher-stable https://releases.rancher.com/server-charts/stable --force-update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install Rancher
      shell: |
        helm upgrade --install rancher rancher-stable/rancher \
          --namespace cattle-system \
          --create-namespace \
          --set hostname={{ rancher_hostname }} \
          --set bootstrapPassword={{ bootstrap_password }} \
          --set ingress.tls.source=rancher \
          --set replicas=1
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    # ── AWX Operator ───────────────────────────────────────
    - name: Add AWX Operator helm repo
      shell: helm repo add awx-operator https://ansible-community.github.io/awx-operator-helm/ --force-update
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    - name: Install AWX Operator
      shell: |
        helm upgrade --install awx-operator awx-operator/awx-operator \
          --namespace awx \
          --create-namespace
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

    # ── AWX Instance ───────────────────────────────────────
    - name: Deploy AWX instance
      shell: |
        kubectl apply -f - <<EOF
        apiVersion: awx.ansible.com/v1beta1
        kind: AWX
        metadata:
          name: awx
          namespace: awx
        spec:
          service_type: ClusterIP
          ingress_type: ingress
          ingress_class_name: traefik
          hostname: {{ awx_hostname }}
          admin_user: admin
          admin_email: {{ awx_admin_email }}
          postgres_storage_class: local-path
          projects_storage_class: local-path
          projects_storage_size: 8Gi
        EOF
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml

  post_tasks:
    - name: Get AWX admin password
      shell: |
        kubectl get secret awx-admin-password -n awx \
          -o jsonpath="{.data.password}" | base64 -d
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: awx_password
      ignore_errors: true

    - name: Show access info
      debug:
        msg:
          - "Rancher: https://{{ rancher_hostname }}"
          - "AWX:     https://{{ awx_hostname }}"
          - "AWX admin password: {{ awx_password.stdout | default('still initializing') }}"
