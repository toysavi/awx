# ansible/inventories/dev/hosts.yml
# Development inventory for AWX-managed hosts
# AWX pulls this file directly from Git (SCM-based inventory)
---
all:
  vars:
    # Default connection settings
    ansible_connection: ssh
    ansible_user: ubuntu
    ansible_ssh_common_args: '-o StrictHostKeyChecking=no'
    # Environment tag used in playbooks for conditional tasks
    environment: dev

  children:
    # Kubernetes cluster nodes
    k8s_cluster:
      hosts:
        k8s-dev-node1:
          ansible_host: 192.168.1.10  # Replace with real IP
          node_role: control-plane
        k8s-dev-node2:
          ansible_host: 192.168.1.11
          node_role: worker

    # Application servers (managed by Ansible via AWX)
    app_servers:
      hosts:
        app-dev-01:
          ansible_host: 192.168.1.20

    # Database servers
    db_servers:
      hosts:
        db-dev-01:
          ansible_host: 192.168.1.30
