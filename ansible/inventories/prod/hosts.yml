# ansible/inventories/prod/hosts.yml
---
all:
  vars:
    ansible_connection: ssh
    ansible_user: ubuntu
    environment: prod
    # Production: always use SSH keys, never passwords
    ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_SSH_KEY_FILE') }}"

  children:
    k8s_cluster:
      hosts:
        k8s-prod-node1:
          ansible_host: 10.0.1.10
          node_role: control-plane
        k8s-prod-node2:
          ansible_host: 10.0.1.11
          node_role: worker
        k8s-prod-node3:
          ansible_host: 10.0.1.12
          node_role: worker

    app_servers:
      hosts:
        app-prod-01:
          ansible_host: 10.0.1.20
        app-prod-02:
          ansible_host: 10.0.1.21

    db_servers:
      hosts:
        db-prod-01:
          ansible_host: 10.0.1.30
