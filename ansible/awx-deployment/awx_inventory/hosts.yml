---
all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    k3s_role: server

k3s_masters:
  hosts:
    awx-master-01:
      ansible_host: 127.0.0.1
      ansible_connection: local   # Deploy directly on this server
      ip: 192.168.1.240           # Server's real IP — used by k3s node binding
      k3s_role: server

k3s_workers:
  hosts: {}
  # Uncomment to add workers:
  # awx-worker-01:
  #   ansible_host: 192.168.1.20
  #   ip: 192.168.1.20
  #   k3s_role: agent
