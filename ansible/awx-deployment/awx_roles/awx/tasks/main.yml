---
- name: Create manifest working directory
  file:
    path: "{{ awx_manifest_dir }}"
    state: directory
    mode: "0755"

# --------------------------------------------------
# TEMPLATE ONLY AWX CR (NO PVC HERE)
# --------------------------------------------------
- name: Template AWX instance CR
  template:
    src: awx-instance.yml.j2
    dest: "{{ awx_manifest_dir }}/awx-instance.yml"
    mode: "0644"

# --------------------------------------------------
# CREATE ADMIN SECRET
# --------------------------------------------------
- name: Create AWX admin secret
  k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: awx-admin-password
        namespace: "{{ awx_namespace }}"
      stringData:
        password: "{{ awx_admin_password }}"

# --------------------------------------------------
# APPLY AWX CR (OPERATOR TRIGGERS EVERYTHING)
# --------------------------------------------------
- name: Apply AWX instance CR
  command: >
    k3s kubectl apply -f {{ awx_manifest_dir }}/awx-instance.yml
  register: awx_apply
  changed_when: awx_apply.rc == 0

# --------------------------------------------------
# WAIT FOR OPERATOR TO CREATE WEB DEPLOYMENT
# --------------------------------------------------
- name: Wait for AWX web deployment to appear
  shell: |
    k3s kubectl get deployment -n {{ awx_namespace }} \
    -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep awx-web
  register: awx_web
  retries: 30
  delay: 10
  until: awx_web.stdout != ""
  changed_when: false

- name: Wait for AWX web rollout
  command: >
    k3s kubectl rollout status deployment/{{ awx_web.stdout }}
    -n {{ awx_namespace }}
    --timeout=600s
  changed_when: false

# --------------------------------------------------
# WAIT FOR OPERATOR TO CREATE TASK DEPLOYMENT
# --------------------------------------------------
- name: Wait for AWX task deployment to appear
  shell: |
    k3s kubectl get deployment -n {{ awx_namespace }} \
    -o jsonpath='{.items[*].metadata.name}' | tr ' ' '\n' | grep awx-task
  register: awx_task
  retries: 30
  delay: 10
  until: awx_task.stdout != ""
  changed_when: false

- name: Wait for AWX task rollout
  command: >
    k3s kubectl rollout status deployment/{{ awx_task.stdout }}
    -n {{ awx_namespace }}
    --timeout=600s
  changed_when: false

# --------------------------------------------------
# GET ADMIN PASSWORD
# --------------------------------------------------
- name: Retrieve admin password secret
  command: >
    k3s kubectl get secret awx-admin-password
    -n {{ awx_namespace }}
    -o jsonpath='{.data.password}'
  register: admin_pw_b64
  changed_when: false

# --------------------------------------------------
# OUTPUT INFO
# --------------------------------------------------
- name: Print AWX access info
  debug:
    msg:
      - "AWX URL: http://{{ awx_fqdn }}"
      - "Admin user: {{ awx_admin_user }}"
      - "Admin password: {{ admin_pw_b64.stdout | b64decode }}"