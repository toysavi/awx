---
# AWX Instance — Production
# Apply: kubectl apply -f k8s/awx/awx-instance-prod.yaml

apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  namespace: awx
spec:
  service_type: ClusterIP
  ingress_type: ingress
  ingress_class_name: traefik
  hostname: awx.yourdomain.com        # Replace with real domain

  admin_user: admin
  admin_email: admin@yourdomain.com

  postgres_storage_class: local-path
  postgres_storage_requirements:
    requests:
      storage: 20Gi
  projects_storage_class: local-path
  projects_storage_size: 20Gi

  web_resource_requirements:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 4000m

  task_resource_requirements:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 4Gi
      cpu: 4000m

  ee_resource_requirements:
    requests:
      memory: 128Mi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 1000m

  extra_settings:
    - setting: SESSION_COOKIE_SECURE
      value: "True"
    - setting: CSRF_COOKIE_SECURE
      value: "True"
    - setting: REMOTE_HOST_HEADERS
      value: "['HTTP_X_FORWARDED_FOR', 'REMOTE_ADDR', 'REMOTE_HOST']"
