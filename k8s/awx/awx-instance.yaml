---
# AWX Instance — Dev / UAT
# Apply: sed "s/REPLACE_WITH_IP/YOUR_IP/g" k8s/awx/awx-instance.yaml | kubectl apply -f -
# Or:    ./scripts/install.sh  (handles replacement automatically)

apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  namespace: awx
spec:
  service_type: ClusterIP
  ingress_type: ingress
  ingress_class_name: traefik
  hostname: awx.REPLACE_WITH_IP.nip.io

  admin_user: admin
  admin_email: admin@example.com

  postgres_storage_class: local-path
  projects_storage_class: local-path
  projects_storage_size: 8Gi

  web_resource_requirements:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m

  task_resource_requirements:
    requests:
      memory: 512Mi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 2000m

  ee_resource_requirements:
    requests:
      memory: 64Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
