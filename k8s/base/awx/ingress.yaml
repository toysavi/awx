# k8s/base/awx/ingress.yaml
# Ingress resource to expose AWX web UI.
# Requires an Ingress controller (nginx-ingress or traefik) in the cluster.
# The hostname is patched by each environment overlay.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: awx-ingress
  labels:
    app.kubernetes.io/component: awx
  annotations:
    # nginx ingress controller annotations
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Increase timeout for long-running Ansible job API calls
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # TLS redirect (enabled in staging/prod overlays)
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx  # Override in overlay if using traefik or other

  # TLS config is added by environment overlays (cert-manager annotation)
  # tls:
  #   - hosts:
  #       - awx.example.com
  #     secretName: awx-tls

  rules:
    - host: awx.example.com  # Patched by each overlay
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: awx-service  # AWX Operator creates this service
                port:
                  number: 80
