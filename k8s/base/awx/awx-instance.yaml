# k8s/base/awx/awx-instance.yaml
# AWX Custom Resource — the AWX Operator watches for this and deploys AWX.
# The operator handles creating: web/task deployments, Redis, service accounts,
# RBAC, and wiring everything together.
apiVersion: awx.ansible.com/v1beta1
kind: AWX
metadata:
  name: awx
  labels:
    app.kubernetes.io/component: awx
spec:
  # ── Service type ─────────────────────────────────────────────────────────
  # ClusterIP: expose via Ingress (recommended for production)
  # NodePort:  direct node access (useful for local/dev without Ingress)
  service_type: ClusterIP

  # ── Ingress ───────────────────────────────────────────────────────────────
  # Managed by the Ingress resource in ingress.yaml (not the operator's ingress)
  ingress_type: none  # We manage our own Ingress resource

  # ── Admin credentials ─────────────────────────────────────────────────────
  # Reference the Kubernetes Secret created by kustomize secretGenerator
  admin_user: admin
  admin_password_secret: awx-admin-password  # Secret key: password

  # ── Database configuration ────────────────────────────────────────────────
  # Point AWX at our externally managed PostgreSQL StatefulSet.
  # This prevents the operator from deploying its own postgres instance.
  postgres_configuration_secret: awx-postgres-configuration

  # ── Resource configuration ────────────────────────────────────────────────
  # Base resources; overlays patch these per environment
  web_resource_requirements:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  task_resource_requirements:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "2Gi"

  # ── Extra settings ────────────────────────────────────────────────────────
  extra_settings:
    # Allow AWX to use GitHub-hosted playbooks via Project SCM
    - setting: AWX_TASK_ENV
      value:
        GIT_SSL_NO_VERIFY: "false"

    # Session cookie security
    - setting: SESSION_COOKIE_SECURE
      value: "true"

    # CSRF security for HTTPS deployments
    - setting: CSRF_COOKIE_SECURE
      value: "true"

  # ── Storage for projects (playbooks fetched from SCM like GitHub) ─────────
  projects_persistence: true
  projects_storage_access_mode: ReadWriteOnce
  projects_storage_size: 8Gi

  # ── Replicas (overridden per environment by overlays) ─────────────────────
  replicas: 1
