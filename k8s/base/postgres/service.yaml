# k8s/base/postgres/service.yaml
# Headless service for stable DNS within the cluster.
# AWX connects to postgres via: awx-postgres.<namespace>.svc.cluster.local:5432
apiVersion: v1
kind: Service
metadata:
  name: awx-postgres
  labels:
    app: awx-postgres
    app.kubernetes.io/component: database
spec:
  # ClusterIP: database is internal-only, never exposed externally
  type: ClusterIP
  selector:
    app: awx-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
