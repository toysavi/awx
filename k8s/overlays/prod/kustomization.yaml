# k8s/overlays/prod/kustomization.yaml
# Production environment: HA replicas, larger resources, TLS, larger storage.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: awx-prod

resources:
  - ../../base
  - namespace.yaml
  - hpa.yaml  # Horizontal Pod Autoscaler for prod

patches:
  - path: patch-resources.yaml
    target:
      kind: AWX
      name: awx

  # Production Postgres: larger storage
  - patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: "50Gi"
    target:
      kind: PersistentVolumeClaim
      name: awx-postgres-pvc

  # Production ingress with TLS via cert-manager + Let's Encrypt prod issuer
  - patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: "awx.example.com"
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: "letsencrypt-prod"
      - op: add
        path: /metadata/annotations/nginx.ingress.kubernetes.io~1ssl-redirect
        value: "true"
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - awx.example.com
            secretName: awx-prod-tls
    target:
      kind: Ingress
      name: awx-ingress

secretGenerator:
  - name: awx-postgres-secret
    envs:
      - secrets.env  # In CI/CD this is written from GitHub Actions Secrets
    options:
      disableNameSuffixHash: true

  - name: awx-postgres-configuration
    literals:
      - host=awx-postgres.awx-prod.svc.cluster.local
      - port=5432
      - database=awx
      - username=awx
      - passwordSecretName=awx-postgres-secret
      - passwordSecretKey=POSTGRES_PASSWORD
    options:
      disableNameSuffixHash: true

  - name: awx-admin-password
    envs:
      - secrets.env
    options:
      disableNameSuffixHash: true

images:
  - name: quay.io/ansible/awx
    newTag: "24.6.1"
