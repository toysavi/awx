# k8s/overlays/prod/patch-resources.yaml
# Production: higher replicas and resources for HA
- op: replace
  path: /spec/replicas
  value: 2  # Two web/task pods for high availability

- op: replace
  path: /spec/web_resource_requirements
  value:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

- op: replace
  path: /spec/task_resource_requirements
  value:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "4Gi"

- op: replace
  path: /spec/projects_storage_size
  value: "20Gi"

# Enable HTTPS security
- op: add
  path: /spec/extra_settings/-
  value:
    setting: SESSION_COOKIE_SECURE
    value: "true"

- op: add
  path: /spec/extra_settings/-
  value:
    setting: CSRF_COOKIE_SECURE
    value: "true"

# Allowed hosts list (add your domain)
- op: add
  path: /spec/extra_settings/-
  value:
    setting: ALLOWED_HOSTS
    value: ["awx.example.com", "localhost"]
