# k8s/overlays/prod/hpa.yaml
# Horizontal Pod Autoscaler for production AWX web deployment.
# Scales based on CPU utilization to handle burst job loads.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: awx-web-hpa
  namespace: awx-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: awx  # AWX Operator creates the deployment with this name
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
