---
# AWX Operator Helm values
# Used with: helm install awx-operator awx-operator/awx-operator -f k8s/operator/values.yaml

# Number of operator replicas
replicaCount: 1

# Operator image
image:
  pullPolicy: IfNotPresent

# Resource limits for operator
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m

# Enable metrics
metrics:
  enabled: false

# AWX Operator specific settings
AWX:
  enabled: false   # Don't auto-create AWX instance via helm values
