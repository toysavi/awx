---
# AWX Operator Helm values
# helm install awx-operator awx-operator/awx-operator -f k8s/operator/values.yaml

replicaCount: 1

image:
  pullPolicy: IfNotPresent

resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 256Mi
    cpu: 500m

AWX:
  enabled: false   # AWX instance managed separately via k8s/awx/awx-instance.yaml
