# k8s/operator/kustomization.yaml
# Installs the AWX Operator into its own namespace.
# The operator watches for AWX Custom Resources and manages AWX deployments.
# Latest stable: https://github.com/ansible/awx-operator/releases
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: awx-operator-system

# Pull the official AWX Operator release bundle directly from GitHub.
# Pin to a specific tag for reproducible deployments.
resources:
  - github.com/ansible/awx-operator/config/default?ref=2.19.1

# Override the operator image tag to match the pinned release.
images:
  - name: quay.io/ansible/awx-operator
    newTag: "2.19.1"
