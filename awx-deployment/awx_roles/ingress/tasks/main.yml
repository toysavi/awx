---
- name: Create manifest directory
  file:
    path: "{{ awx_manifest_dir }}"
    state: directory
    mode: "0755"

- name: Template Ingress manifest
  template:
    src: ingress.yml.j2
    dest: "{{ awx_manifest_dir }}/ingress.yml"
    mode: "0644"

- name: Apply Ingress manifest
  command: k3s kubectl apply -f {{ awx_manifest_dir }}/ingress.yml
  register: ingress_apply
  changed_when: "'created' in ingress_apply.stdout or 'configured' in ingress_apply.stdout"

- name: Verify AWX ingress exists
  command: k3s kubectl get ingress awx-ingress -n awx
  register: ingress_check
  retries: 20
  delay: 5
  until: ingress_check.rc == 0
  changed_when: false

- name: Get ingress host
  command: >
    k3s kubectl get ingress awx-ingress -n awx
    -o jsonpath='{.spec.rules[0].host}'
  register: ingress_host
  changed_when: false