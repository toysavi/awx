---
- name: Create .kube directory
  file:
    path: /root/.kube
    state: directory
    mode: "0700"

- name: Copy k3s kubeconfig to ~/.kube/config
  copy:
    src: "{{ k3s_kubeconfig_src }}"
    dest: "{{ kubeconfig_path }}"
    remote_src: true
    mode: "0600"

- name: Set KUBECONFIG in /etc/environment
  lineinfile:
    path: /etc/environment
    line: 'KUBECONFIG=/root/.kube/config'
    create: true

- name: Verify kubectl can reach cluster
  command: k3s kubectl get nodes
  register: kubectl_check
  changed_when: false
  retries: 5
  delay: 5

- name: Show cluster nodes
  debug:
    msg: "{{ kubectl_check.stdout_lines }}"
