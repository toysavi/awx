---
# Traefik Dashboard — Secured IngressRoute
# Access: https://traefik.REPLACE_WITH_IP.nip.io/dashboard/
# Note: trailing slash required

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.REPLACE_WITH_IP.nip.io`) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      middlewares:
        - name: dashboard-auth
          namespace: kube-system
        - name: security-headers
          namespace: kube-system
      services:
        - name: api@internal
          kind: TraefikService
  tls: {}
