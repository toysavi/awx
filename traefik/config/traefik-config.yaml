---
# Traefik Configuration for k3s
# Apply: kubectl apply -f traefik/config/traefik-config.yaml

apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-

    globalArguments:
      - "--global.sendanonymoususage=false"
      - "--global.checknewversion=false"

    additionalArguments:
      - "--serversTransport.insecureSkipVerify=true"

    ports:
      web:
        port: 8000
        exposedPort: 80
        protocol: TCP
        redirectTo:
          port: websecure
          scheme: https
          permanent: true
      websecure:
        port: 8443
        exposedPort: 443
        protocol: TCP
        tls:
          enabled: true
          options: "default"
      traefik:
        port: 9000
        expose:
          default: false

    tlsOptions:
      default:
        minVersion: VersionTLS12
        cipherSuites:
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
          - TLS_AES_128_GCM_SHA256
          - TLS_AES_256_GCM_SHA384
          - TLS_CHACHA20_POLY1305_SHA256

    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
      kubernetesIngress:
        enabled: true
        publishedService:
          enabled: true

    logs:
      general:
        level: INFO
      access:
        enabled: true
        format: json

    ingressRoute:
      dashboard:
        enabled: false

    service:
      enabled: true
      type: LoadBalancer

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi

    deployment:
      replicas: 1
