---
# IngressRoutes for AWX and Rancher
# IP placeholder replaced by setup-traefik.sh automatically

# ── AWX HTTPS ────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: awx-https
  namespace: awx
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`awx.REPLACE_WITH_IP.nip.io`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: kube-system
        - name: rate-limit
          namespace: kube-system
        - name: compress
          namespace: kube-system
      services:
        - name: awx-service
          port: 80
  tls: {}

---
# ── AWX HTTP → HTTPS redirect ────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: awx-http-redirect
  namespace: awx
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`awx.REPLACE_WITH_IP.nip.io`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: kube-system
      services:
        - name: awx-service
          port: 80

---
# ── Rancher HTTPS ────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rancher-https
  namespace: cattle-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`REPLACE_WITH_IP.nip.io`)
      kind: Rule
      middlewares:
        - name: security-headers
          namespace: kube-system
        - name: rate-limit
          namespace: kube-system
      services:
        - name: rancher
          port: 443
          scheme: https
  tls: {}

---
# ── Rancher HTTP → HTTPS redirect ────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rancher-http-redirect
  namespace: cattle-system
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`REPLACE_WITH_IP.nip.io`)
      kind: Rule
      middlewares:
        - name: redirect-https
          namespace: kube-system
      services:
        - name: rancher
          port: 80
