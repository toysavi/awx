---
# ============================================================
# Play 1 — Build in-memory host AND hoist vars to localhost
# ============================================================
- name: Register dynamic target into in-memory inventory
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Add target into in-memory group 'provisioning'
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        groups: provisioning
        ansible_host: "{{ target_ip }}"
        ansible_user: "{{ ssh_user }}"
        ansible_password: "{{ ssh_password }}"
        ansible_port: "{{ ssh_port | default(22) }}"
        ansible_connection: ssh
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        target_ip: "{{ target_ip }}"
        ssh_user: "{{ ssh_user }}"
        ssh_port: "{{ ssh_port | default(22) }}"
        vm_name: "{{ vm_name }}"
        environment: "{{ environment | default('Non-Production') }}"

    # FIX 1 — hoist survey vars onto localhost so Play 4 can read them
    # without crossing into the provisioning group's hostvars scope
    - name: Cache survey vars on localhost for Play 4
      ansible.builtin.set_fact:
        _vm_name: "{{ vm_name }}"
        _target_ip: "{{ target_ip }}"
        _ssh_user: "{{ ssh_user }}"
        _ssh_port: "{{ ssh_port | default(22) }}"
        _environment: "{{ environment | default('Non-Production') }}"


# ============================================================
# Play 2 — Wait for SSH, gather facts
# ============================================================
- name: Wait for target to become reachable
  hosts: provisioning
  gather_facts: false

  tasks:
    - name: Wait for SSH port to open
      ansible.builtin.wait_for_connection:
        timeout: 120
        sleep: 5

    - name: Gather facts now that host is reachable
      ansible.builtin.setup:


# ============================================================
# Play 3 — Bootstrap: apply roles
# ============================================================
- name: Bootstrap Linux server
  hosts: provisioning
  become: true
  gather_facts: false

  roles:
    - common

  tasks:
    - name: Verify expected services are running
      ansible.builtin.service_facts:

    - name: Assert sshd is active
      ansible.builtin.assert:
        that: ansible_facts.services['sshd.service'].state == 'running'
        fail_msg: "sshd is not running on {{ inventory_hostname }}"


# ============================================================
# Play 4 — Persist host into AWX inventory
# ============================================================
- name: Register host into AWX inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false          # ← CRITICAL: explicitly cancel Play 3's become: true
                         #   AWX execution environments have no sudo binary
                         #   on the controller; without this it inherits become
                         #   from the previous play context in some EE builds

  tasks:
    - name: Add host to AWX inventory
      awx.awx.host:
        controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
        controller_oauthtoken: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"
        name: "{{ _vm_name }}"
        inventory: "{{ _environment }}"
        description: "Provisioned by AWX job {{ lookup('env', 'AWX_JOB_ID') }}"
        variables:
          ansible_host: "{{ _target_ip }}"
          ansible_user: "{{ _ssh_user }}"
          ansible_port: "{{ _ssh_port }}"
          provisioned_by: "awx"
          provisioned_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        state: present
      become: false       # ← belt-and-suspenders: also disable at task level
                          #   in case the EE or role sets become globally