---
# ============================================================
# Play 1 — Validate, build in-memory host, cache vars
# ============================================================
- name: Register dynamic target into in-memory inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Validate target_environment is a known inventory
      ansible.builtin.assert:
        that:
          - target_environment in ['Non-Productions', 'Productions']
        fail_msg: >
          Invalid target_environment '{{ target_environment }}'.
          Must be exactly 'Non-Productions' or 'Productions'.

    - name: Add target into in-memory group 'provisioning'
      ansible.builtin.add_host:
        name: "{{ vm_name }}"
        groups: provisioning
        ansible_host: "{{ target_ip }}"
        ansible_user: "{{ ssh_user }}"
        ansible_password: "{{ ssh_password }}"
        ansible_port: "{{ ssh_port | default(22) }}"
        ansible_connection: ssh
        ansible_python_interpreter: /usr/bin/python3
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
        target_environment: "{{ target_environment }}"
        target_ip: "{{ target_ip }}"
        ssh_user: "{{ ssh_user }}"
        ssh_port: "{{ ssh_port | default(22) }}"
        vm_name: "{{ vm_name }}"

    - name: Cache survey vars on localhost for Play 4
      ansible.builtin.set_fact:
        _vm_name: "{{ vm_name }}"
        _target_ip: "{{ target_ip }}"
        _ssh_user: "{{ ssh_user }}"
        _ssh_port: "{{ ssh_port | default(22) }}"
        _target_environment: "{{ target_environment }}"


# ============================================================
# Play 2 — Wait for SSH to be ready, then gather facts
# ============================================================
- name: Wait for target to become reachable
  hosts: provisioning
  gather_facts: false
  become: false

  tasks:
    - name: Wait for SSH port to open
      ansible.builtin.wait_for_connection:
        timeout: 120
        sleep: 5

    - name: Wait for cloud-init to finish
      ansible.builtin.raw: >
        timeout 60 bash -c
        'until [ ! -f /run/cloud-init/enabled ] ||
        systemctl is-active cloud-init-local.service cloud-init.service
        cloud-config.service cloud-final.service 2>/dev/null | grep -q "^inactive$";
        do sleep 3; done'
      changed_when: false
      failed_when: false

    - name: Wait for package manager lock to release
      ansible.builtin.raw: >
        timeout 60 bash -c
        'while fuser /var/lib/rpm/.rpm.lock /var/lib/dnf/yumdb 2>/dev/null;
        do sleep 3; done'
      changed_when: false
      failed_when: false

    - name: Gather facts now that host is reachable
      ansible.builtin.setup:
        gather_timeout: 30          # fail fast instead of hanging forever
        gather_subset:
          - min                     # os, hardware basics — skip slow package facts
          - '!facter'               # skip facter if installed (very slow)
          - '!ohai'                 # skip ohai if installed


# ============================================================
# Play 3 — Bootstrap: apply common role
# ============================================================
- name: Bootstrap Linux server
  hosts: provisioning
  become: true
  gather_facts: false

  roles:
    - common

  tasks:
    - name: Verify expected services are running
      ansible.builtin.service_facts:

    - name: Assert sshd is active
      ansible.builtin.assert:
        that: ansible_facts.services['sshd.service'].state == 'running'
        fail_msg: "sshd is not running on {{ inventory_hostname }}"


# ============================================================
# Play 4 — Persist host into AWX inventory
# - become: false  → EE container has no sudo; must be explicit
# - reads _vars    → set_fact'd in Play 1 on localhost scope
# - lookup('pipe') → no gather_facts so ansible_date_time unavailable
# ============================================================
- name: Register host into AWX inventory
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  tasks:
    - name: Add host to AWX inventory
      awx.awx.host:
        controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
        controller_oauthtoken: "{{ lookup('env', 'CONTROLLER_OAUTH_TOKEN') }}"
        name: "{{ _vm_name }}"
        inventory: "{{ _target_environment }}"
        description: "Provisioned by AWX job {{ lookup('env', 'AWX_JOB_ID') }}"
        variables:
          ansible_host: "{{ _target_ip }}"
          ansible_user: "{{ _ssh_user }}"
          ansible_port: "{{ _ssh_port }}"
          ansible_python_interpreter: /usr/bin/python3
          provisioned_by: "awx"
          provisioned_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
        state: present
      become: false