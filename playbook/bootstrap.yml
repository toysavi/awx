---
- name: Register host into AWX
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Add host to AWX inventory
      awx.awx.host:
        controller_host: https://awx.domain.local
        controller_oauthtoken: YOUR_AWX_TOKEN

        name: ol9-app01
        inventory: Production

        variables:
          ansible_host: 10.10.10.55
          ansible_user: ansible

        state: present