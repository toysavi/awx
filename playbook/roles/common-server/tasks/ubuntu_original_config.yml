---
########## Backup original configuration files (Ubuntu/Debian) ##########

- name: Backup original config files (skip if backup already exists)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    force: false
  become: true
  loop:
    - { src: /etc/issue,                                      dest: /etc/issue.orig }
    - { src: /etc/issue.net,                                  dest: /etc/issue.net.orig }
    - { src: /etc/sysctl.conf,                                dest: /etc/sysctl.conf.orig }
    - { src: /etc/rsyslog.conf,                               dest: /etc/rsyslog.conf.orig }
    - { src: /etc/sudoers,                                    dest: /etc/sudoer.orig }
    - { src: /etc/ssh/sshd_config,                            dest: /etc/ssh/sshd_config.orig }
    - { src: /etc/login.defs,                                 dest: /etc/login.defs.orig }
    - { src: /etc/passwd,                                     dest: /etc/passwd.orig }
    - { src: /etc/group,                                      dest: /etc/group.orig }
    - { src: /etc/shadow,                                     dest: /etc/shadow.orig }
    - { src: /etc/gshadow,                                    dest: /etc/gshadow.orig }
    - { src: /etc/fstab,                                      dest: /etc/fstab.orig }
    - { src: /etc/resolv.conf,                                dest: /etc/resolv.conf.orig }
    - { src: /etc/pam.d/common-password,                      dest: /etc/pam.d/common-password.orig }
    - { src: /etc/pam.d/common-session,                       dest: /etc/pam.d/common-session.orig }
    - { src: /etc/pam.d/common-auth,                          dest: /etc/pam.d/common-auth.orig }
    - { src: /etc/pam.d/common-account,                       dest: /etc/pam.d/common-account.orig }
  ignore_errors: true

- name: Backup original config directories (skip if backup already exists)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    force: false
  become: true
  loop:
    - { src: /etc/modprobe.d/,   dest: /etc/modprobe.d.orig }
    - { src: /etc/sysctl.d/,     dest: /etc/sysctl.d.orig }
    - { src: /etc/rsyslog.d/,    dest: /etc/rsyslog.d.orig }
    - { src: /etc/sudoers.d/,    dest: /etc/sudoers.d.orig }
    - { src: /etc/ssh/,          dest: /etc/ssh.orig }
    - { src: /etc/pam.d/,        dest: /etc/pam.d.orig }
    - { src: /etc/security/,     dest: /etc/security.orig }
    - { src: /etc/apt/,          dest: /etc/apt.orig }
  ignore_errors: true

- name: Backup optional files (ignore if missing)
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    remote_src: true
    force: false
  become: true
  loop:
    - { src: /etc/profile.d/01-locale-fix.sh,                 dest: /etc/profile.d/01-locale-fix.sh.orig }
    - { src: /etc/pam.d/common-session-noninteractive,        dest: /etc/pam.d/common-session-noninteractive.orig }
  ignore_errors: true