# =============================================================================
# NTP CONFIGURATION
# =============================================================================

- name: Import chrony config for Oracle Linux 9
  ansible.builtin.include_tasks: oracle9_chrony.yml
  tags:
    - ntp
  when:
    - ansible_facts.distribution == 'OracleLinux'
    - ansible_facts.distribution_major_version == '9'
    - sv_common_enable | default(true) | bool

- name: Import chrony config for Oracle Linux 8
  ansible.builtin.include_tasks: oracle8_chrony.yml
  tags:
    - ntp
  when:
    - ansible_facts.distribution == 'OracleLinux'
    - ansible_facts.distribution_major_version == '8'
    - sv_common_enable | default(true) | bool

- name: Import chrony config for RedHat / CentOS
  ansible.builtin.include_tasks: redhat_chrony.yml
  tags:
    - ntp
  when:
    - ansible_facts.os_family == 'RedHat'
    - ansible_facts.distribution != 'OracleLinux'
    - sv_common_enable | default(true) | bool

- name: Import chrony config for Ubuntu 20.04
  ansible.builtin.include_tasks: ubuntu_chrony.yml
  tags:
    - ntp
  when:
    - ansible_facts.distribution == 'Ubuntu'
    - ansible_facts.distribution_major_version | int in [20, 22, 24, 26]
    - sv_common_enable | default(true) | bool

- name: Import chrony config for Debian
  ansible.builtin.include_tasks: ubuntu_chrony.yml   # same file, same config
  tags:
    - ntp
  when:
    - ansible_facts.distribution == 'Debian'
    - sv_common_enable | default(true) | bool

- name: Import NTP config for Solaris
  ansible.builtin.include_tasks: solaris_ntp.yml
  tags:
    - ntp
  when:
    - ansible_facts.os_family == 'Solaris'
    - sv_common_enable | default(true) | bool


