---
# =============================================================================
# ubuntu_chrony.yml
# Chrony NTP configuration for Ubuntu LTS
# Supports: 20.04 (Focal), 22.04 (Jammy), 24.04 (Noble), 26.04 (Resolute)
# =============================================================================

- name: Debug Ubuntu version
  ansible.builtin.debug:
    msg:
      distribution:         "{{ ansible_facts.distribution }}"
      distribution_version: "{{ ansible_facts.distribution_version }}"
      distribution_major:   "{{ ansible_facts.distribution_major_version }}"

- name: Install chrony — Ubuntu 20.04 / 22.04
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
  when: ansible_facts.distribution_major_version | int <= 22

- name: Ensure chrony is present — Ubuntu 24.04 / 26.04 (pre-installed)
  ansible.builtin.apt:
    name: chrony
    state: present
  when: ansible_facts.distribution_major_version | int >= 24

- name: Backup chrony.conf — Ubuntu (skip if backup exists)
  ansible.builtin.copy:
    src: /etc/chrony/chrony.conf
    dest: /etc/chrony/chrony.conf.orig
    remote_src: true
    force: false
  ignore_errors: true

- name: Enable and start chrony — Ubuntu
  ansible.builtin.systemd:
    name: chrony
    state: started
    enabled: true

# ── Disable all default pool lines ─────────────────────────

- name: Comment out pool ntp.ubuntu.com line — Ubuntu
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^pool ntp\.ubuntu\.com(.*)'
    line: '# pool ntp.ubuntu.com iburst'
    backrefs: true

- name: Comment out pool 0.ubuntu.pool.ntp.org line — Ubuntu
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^pool 0\.ubuntu\.pool\.ntp\.org(.*)'
    line: '# pool 0.ubuntu.pool.ntp.org iburst'
    backrefs: true
  ignore_errors: true

- name: Comment out pool 1.ubuntu.pool.ntp.org line — Ubuntu
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^pool 1\.ubuntu\.pool\.ntp\.org(.*)'
    line: '# pool 1.ubuntu.pool.ntp.org iburst'
    backrefs: true
  ignore_errors: true

- name: Comment out pool 2.ubuntu.pool.ntp.org line — Ubuntu
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^pool 2\.ubuntu\.pool\.ntp\.org(.*)'
    line: '# pool 2.ubuntu.pool.ntp.org iburst'
    backrefs: true
  ignore_errors: true

- name: Comment out pool 3.ubuntu.pool.ntp.org line — Ubuntu
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    regexp: '^pool 3\.ubuntu\.pool\.ntp\.org(.*)'
    line: '# pool 3.ubuntu.pool.ntp.org iburst'
    backrefs: true
  ignore_errors: true

- name: Comment out any remaining pool lines — Ubuntu
  ansible.builtin.replace:
    path: /etc/chrony/chrony.conf
    regexp: '^(pool (?!.*#).*)$'
    replace: '# \1'

# ── Add internal NTP servers ────────────────────────────────

- name: Add primary NTP server — Ubuntu
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    insertafter: '^# pool ntp\.ubuntu\.com'
    line: 'server 192.168.1.5 iburst'

- name: Add secondary NTP server — Ubuntu
  ansible.builtin.lineinfile:
    path: /etc/chrony/chrony.conf
    insertafter: '^server 192\.168\.1\.5 iburst'
    line: 'server 192.168.1.6 iburst'

- name: Set timezone to Asia/Phnom_Penh — Ubuntu
  community.general.timezone:
    name: Asia/Phnom_Penh

- name: Restart chrony to apply changes — Ubuntu
  ansible.builtin.systemd:
    name: chrony
    state: restarted

- name: Enable NTP sync — Ubuntu
  ansible.builtin.command:
    cmd: timedatectl set-ntp on
  changed_when: true

- name: Wait for chrony to sync — Ubuntu
  ansible.builtin.pause:
    seconds: 5

- name: Show chrony sources — Ubuntu
  ansible.builtin.command:
    cmd: chronyc sources
  register: chrony_sources
  changed_when: false
  failed_when: false

- name: Debug chrony sources — Ubuntu
  ansible.builtin.debug:
    var: chrony_sources.stdout_lines

- name: Show chrony sourcestats — Ubuntu
  ansible.builtin.command:
    cmd: chronyc sourcestats
  register: chrony_sourcestats
  changed_when: false
  failed_when: false

- name: Debug chrony sourcestats — Ubuntu
  ansible.builtin.debug:
    var: chrony_sourcestats.stdout_lines

- name: Show timedatectl status — Ubuntu
  ansible.builtin.command:
    cmd: timedatectl status
  register: timedatectl_status
  changed_when: false
  failed_when: false

- name: Debug timedatectl status — Ubuntu
  ansible.builtin.debug:
    var: timedatectl_status.stdout_lines

- name: Show final chrony.conf — Ubuntu
  ansible.builtin.command:
    cmd: cat /etc/chrony/chrony.conf
  register: chrony_conf
  changed_when: false

- name: Debug final chrony.conf — Ubuntu
  ansible.builtin.debug:
    var: chrony_conf.stdout_lines