---
# =============================================================================
# oracle9_ssh_hardening.yml
# SSH + PAM + Password hardening for Oracle Linux 9
# =============================================================================

# ── Required packages ───────────────────────────────────────

- name: Install SELinux utilities — OL9
  ansible.builtin.package:
    name:
      - policycoreutils-python-utils
    state: present

# ── sshd_config permissions ─────────────────────────────────

- name: Set sshd_config ownership to root:root — OL9
  ansible.builtin.file:
    path: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0600'

# ── sshd_config hardening ───────────────────────────────────

- name: Set SSH Port to 2222 — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port '
    line: 'Port 2222'

- name: Set SSH LogLevel to INFO — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?LogLevel '
    line: 'LogLevel INFO'

- name: Disable HostbasedAuthentication — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?HostbasedAuthentication '
    line: 'HostbasedAuthentication no'

- name: Disable PermitEmptyPasswords — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitEmptyPasswords '
    line: 'PermitEmptyPasswords no'

- name: Disable PermitUserEnvironment — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitUserEnvironment '
    line: 'PermitUserEnvironment no'

- name: Set SSH warning banner — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Banner '
    line: 'Banner /etc/issue.net'

- name: Set MaxAuthTries to 4 — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries '
    line: 'MaxAuthTries 4'

- name: Set MaxSessions to 10 — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxSessions '
    line: 'MaxSessions 10'

- name: Set LoginGraceTime to 60 — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?LoginGraceTime '
    line: 'LoginGraceTime 60'

- name: Set ClientAliveInterval to 900 — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ClientAliveInterval '
    line: 'ClientAliveInterval 900'

- name: Set ClientAliveCountMax to 0 — OL9
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?ClientAliveCountMax '
    line: 'ClientAliveCountMax 0'

# ── SELinux SSH port handling ──────────────────────────────

- name: Allow SSH on port 2222 in SELinux — OL9
  community.general.seport:
    ports: 2222
    proto: tcp
    setype: ssh_port_t
    state: present

# ── Firewall ────────────────────────────────────────────────

- name: Open firewall port 2222/tcp — OL9
  ansible.posix.firewalld:
    port: 2222/tcp
    permanent: true
    state: enabled
    immediate: true

# ── Validate sshd config before restart ─────────────────────

- name: Validate sshd configuration — OL9
  ansible.builtin.command:
    cmd: sshd -t
  register: sshd_test
  changed_when: false

# ── Restart SSH safely ──────────────────────────────────────

- name: Restart sshd to apply changes — OL9
  ansible.builtin.systemd:
    name: sshd
    state: restarted
  when: sshd_test.rc == 0

# ── Password quality ────────────────────────────────────────

- name: Set password quality requirements — OL9
  ansible.builtin.lineinfile:
    path: /etc/security/pwquality.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^#?minlen',   line: 'minlen = 8' }
    - { regexp: '^#?minclass', line: 'minclass = 4' }
    - { regexp: '^#?dcredit',  line: 'dcredit = -1' }
    - { regexp: '^#?ucredit',  line: 'ucredit = -1' }
    - { regexp: '^#?ocredit',  line: 'ocredit = -1' }
    - { regexp: '^#?lcredit',  line: 'lcredit = -1' }

# ── PAM faillock ────────────────────────────────────────────

- name: Configure faillock.conf — OL9
  ansible.builtin.lineinfile:
    path: /etc/security/faillock.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^#?deny ',          line: 'deny = 5' }
    - { regexp: '^#?fail_interval ', line: 'fail_interval = 900' }
    - { regexp: '^#?unlock_time ',   line: 'unlock_time = 900' }

# ── Verify ──────────────────────────────────────────────────

- name: Show sshd effective config — OL9
  ansible.builtin.command:
    cmd: sshd -T
  register: sshd_verify
  changed_when: false

- name: Debug sshd config — OL9
  ansible.builtin.debug:
    var: sshd_verify.stdout_lines

