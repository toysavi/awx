# docker-compose.override.yml
# ============================================================
# Local development overrides.
# Automatically merged with docker-compose.yml when running
# `docker compose up` locally. Not used in CI/CD.
# ============================================================
version: '3.8'

services:
  # Expose postgres port locally for DB tools (DBeaver, pgAdmin, etc.)
  postgres:
    ports:
      - "5432:5432"

  # Expose redis port locally for debugging
  redis:
    ports:
      - "6379:6379"

  # AWX web: direct access without nginx in dev
  awx-web:
    ports:
      - "8052:8052"

  # Nginx not needed locally — access AWX directly on 8052
  nginx:
    profiles:
      - production  # Only starts with: docker compose --profile production up
