# .github/workflows/deploy.yml
# ============================================================
# GitOps CD Pipeline for AWX Docker Compose
#
# Triggers:
#   - Push to main     → deploy to dev (auto)
#   - Push to release/ → deploy to staging (auto)
#   - Manual trigger   → deploy to prod (requires approval)
#
# Required GitHub Secrets:
#   SSH_PRIVATE_KEY          - SSH key to connect to server
#   DEV_SERVER_IP            - Dev server IP/hostname
#   STAGING_SERVER_IP        - Staging server IP
#   PROD_SERVER_IP           - Production server IP
#   POSTGRES_PASSWORD_DEV    - DB password for dev
#   POSTGRES_PASSWORD_STAGING
#   POSTGRES_PASSWORD_PROD
#   AWX_ADMIN_PASSWORD_DEV   - AWX admin password for dev
#   AWX_ADMIN_PASSWORD_STAGING
#   AWX_ADMIN_PASSWORD_PROD
#   SECRET_KEY_DEV           - Django secret key for dev
#   SECRET_KEY_STAGING
#   SECRET_KEY_PROD
# ============================================================
name: Deploy AWX

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, prod]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      server_ip:   ${{ steps.env.outputs.server_ip }}

    steps:
      - name: Determine target
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="dev"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            ENV="staging"
          else
            ENV="dev"
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $ENV"

  validate:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          # Create dummy .env for validation
          cat > .env << 'EOF'
          POSTGRES_PASSWORD=placeholder
          AWX_ADMIN_PASSWORD=placeholder
          SECRET_KEY=placeholder_secret_key_for_validation_only
          EOF
          docker compose config --quiet
          echo "docker-compose.yml is valid"

      - name: Scan for secrets in code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prod-approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: [set-environment, validate]
    if: needs.set-environment.outputs.environment == 'prod'
    environment:
      name: production  # Configure required reviewers in GitHub settings
    steps:
      - run: echo "Production deployment approved."

  deploy:
    name: Deploy to ${{ needs.set-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [set-environment, validate, prod-approval]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.prod-approval.result == 'success' || needs.prod-approval.result == 'skipped')

    environment:
      name: ${{ needs.set-environment.outputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
        env:
          SERVER_IP: ${{ secrets[format('{0}_SERVER_IP', upper(needs.set-environment.outputs.environment))] }}

      - name: Sync repository to server
        env:
          ENV:       ${{ needs.set-environment.outputs.environment }}
          SERVER_IP: ${{ secrets[format('{0}_SERVER_IP', upper(needs.set-environment.outputs.environment))] }}
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='envs/*.env' \
            ./ "root@${SERVER_IP}:/awx-docker/"

      - name: Write .env file on server
        env:
          ENV:       ${{ needs.set-environment.outputs.environment }}
          SERVER_IP: ${{ secrets[format('{0}_SERVER_IP', upper(needs.set-environment.outputs.environment))] }}
          UPPER_ENV: ${{ upper(needs.set-environment.outputs.environment) }}
        run: |
          # Select secrets for the target environment
          PG_PASS="${{ secrets[format('POSTGRES_PASSWORD_{0}', upper(needs.set-environment.outputs.environment))] }}"
          AWX_PASS="${{ secrets[format('AWX_ADMIN_PASSWORD_{0}', upper(needs.set-environment.outputs.environment))] }}"
          SK="${{ secrets[format('SECRET_KEY_{0}', upper(needs.set-environment.outputs.environment))] }}"

          ssh "root@${SERVER_IP}" "cat > /awx-docker/.env" << EOF
          POSTGRES_PASSWORD=${PG_PASS}
          AWX_ADMIN_PASSWORD=${AWX_PASS}
          SECRET_KEY=${SK}
          ENVIRONMENT=${ENV}
          EOF

          ssh "root@${SERVER_IP}" "chmod 600 /awx-docker/.env"

      - name: Deploy AWX
        env:
          ENV:       ${{ needs.set-environment.outputs.environment }}
          SERVER_IP: ${{ secrets[format('{0}_SERVER_IP', upper(needs.set-environment.outputs.environment))] }}
        run: |
          ssh "root@${SERVER_IP}" \
            "cd /awx-docker && chmod +x scripts/*.sh && ./scripts/deploy.sh ${ENV}"

      - name: Health check
        env:
          SERVER_IP: ${{ secrets[format('{0}_SERVER_IP', upper(needs.set-environment.outputs.environment))] }}
        run: |
          ssh "root@${SERVER_IP}" "cd /awx-docker && ./scripts/healthcheck.sh"

      - name: Deployment summary
        if: always()
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | $ENV |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
