# .github/workflows/deploy.yml
# ============================================================
# GitOps CD Pipeline for AWX
#
# Triggers:
#   - Push to main          → deploy to dev (auto)
#   - Push to release/**    → deploy to staging (auto)
#   - workflow_dispatch     → deploy to prod (manual, requires approval)
#
# Required GitHub Secrets (set in repo Settings → Secrets):
#   KUBECONFIG_DEV          - base64-encoded kubeconfig for dev cluster
#   KUBECONFIG_STAGING      - base64-encoded kubeconfig for staging cluster
#   KUBECONFIG_PROD         - base64-encoded kubeconfig for prod cluster
#   POSTGRES_PASSWORD_DEV   - PostgreSQL password for dev
#   POSTGRES_PASSWORD_STAGING
#   POSTGRES_PASSWORD_PROD
#   AWX_ADMIN_PASSWORD_DEV  - AWX admin password for dev
#   AWX_ADMIN_PASSWORD_STAGING
#   AWX_ADMIN_PASSWORD_PROD
# ============================================================
name: Deploy AWX

on:
  push:
    branches:
      - main          # Auto-deploy to dev on every merge
      - 'release/**'  # Auto-deploy to staging on release branches

  workflow_dispatch:  # Manual trigger for prod
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      dry_run:
        description: "Dry run only (no changes applied)"
        required: false
        type: boolean
        default: false

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  KUSTOMIZE_VERSION: v5.3.0
  AWX_OPERATOR_VERSION: "2.19.1"

jobs:
  # ────────────────────────────────────────────────────────────
  # Determine target environment from branch or manual input
  # ────────────────────────────────────────────────────────────
  set-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      dry_run: ${{ steps.env.outputs.dry_run }}

    steps:
      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
            DRY="${{ github.event.inputs.dry_run }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="dev"
            DRY="false"
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            ENV="staging"
            DRY="false"
          else
            ENV="dev"
            DRY="true"  # Unknown branch: dry-run only
          fi
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          echo "Deploying to: $ENV (dry_run=$DRY)"

  # ────────────────────────────────────────────────────────────
  # Validate manifests (runs on every push)
  # ────────────────────────────────────────────────────────────
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    needs: set-environment

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Create placeholder secrets.env for validation
        # The secrets.env file is gitignored — create a placeholder for kustomize build
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          cat > "k8s/overlays/${ENV}/secrets.env" <<'EOF'
          POSTGRES_PASSWORD=placeholder
          POSTGRES_DB=awx
          POSTGRES_USER=awx
          AWX_ADMIN_PASSWORD=placeholder
          EOF

      - name: Build manifests (dry-run validation)
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          echo "Building overlay: k8s/overlays/$ENV"
          kustomize build "k8s/overlays/$ENV" > /tmp/manifest.yaml
          echo "Manifest lines: $(wc -l < /tmp/manifest.yaml)"

      - name: Install kubeconform
        run: |
          curl -sLO https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests with kubeconform
        run: |
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/manifest.yaml
          echo "Manifest validation passed."

  # ────────────────────────────────────────────────────────────
  # Require approval for production deployments
  # ────────────────────────────────────────────────────────────
  prod-approval:
    name: Production Approval
    runs-on: ubuntu-latest
    needs: [set-environment, validate]
    if: needs.set-environment.outputs.environment == 'prod'
    environment:
      name: production  # Configure required reviewers in GitHub repo settings
    steps:
      - name: Approved
        run: echo "Production deployment approved."

  # ────────────────────────────────────────────────────────────
  # Deploy to the target environment
  # ────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ needs.set-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: [set-environment, validate, prod-approval]
    # prod-approval is skipped for non-prod; the `always()` handles that
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.prod-approval.result == 'success' || needs.prod-approval.result == 'skipped')

    environment:
      name: ${{ needs.set-environment.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -sLO "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Set up kubectl
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          # Select the appropriate kubeconfig secret based on environment
          case "$ENV" in
            dev)     KUBECONFIG_B64="${{ secrets.KUBECONFIG_DEV }}" ;;
            staging) KUBECONFIG_B64="${{ secrets.KUBECONFIG_STAGING }}" ;;
            prod)    KUBECONFIG_B64="${{ secrets.KUBECONFIG_PROD }}" ;;
          esac

          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          kubectl version --client
          kubectl cluster-info

      - name: Write secrets.env from GitHub Secrets
        # Inject secrets from GitHub Actions into the secrets.env file.
        # This file is used by kustomize secretGenerator.
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          UPPER_ENV=$(echo "$ENV" | tr '[:lower:]' '[:upper:]')

          # Dynamically select the right secret variables per environment
          PG_PASS_VAR="POSTGRES_PASSWORD_${UPPER_ENV}"
          ADMIN_PASS_VAR="AWX_ADMIN_PASSWORD_${UPPER_ENV}"

          cat > "k8s/overlays/${ENV}/secrets.env" <<EOF
          POSTGRES_PASSWORD=${{ secrets[env.PG_PASS_VAR] }}
          POSTGRES_DB=awx
          POSTGRES_USER=awx
          AWX_ADMIN_PASSWORD=${{ secrets[env.ADMIN_PASS_VAR] }}
          EOF

          echo "Secrets file written for environment: $ENV"

      - name: Deploy AWX Operator
        run: |
          kustomize build k8s/operator | kubectl apply -f -
          echo "Waiting for operator..."
          kubectl wait deployment \
            --selector=app.kubernetes.io/name=awx-operator \
            --for=condition=Available \
            --namespace=awx-operator-system \
            --timeout=180s || true

      - name: Deploy AWX
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          DRY="${{ needs.set-environment.outputs.dry_run }}"

          if [[ "$DRY" == "true" ]]; then
            echo "DRY RUN — applying with --dry-run=server..."
            kustomize build "k8s/overlays/$ENV" | kubectl apply --dry-run=server -f -
          else
            kustomize build "k8s/overlays/$ENV" | kubectl apply -f -
          fi

      - name: Wait for PostgreSQL
        if: needs.set-environment.outputs.dry_run != 'true'
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          NAMESPACE="awx-${ENV}"
          kubectl rollout status statefulset/awx-postgres \
            --namespace="$NAMESPACE" \
            --timeout=300s || echo "PostgreSQL rollout still in progress"

      - name: Wait for AWX (up to 15 min)
        if: needs.set-environment.outputs.dry_run != 'true'
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          NAMESPACE="awx-${ENV}"

          echo "Polling for AWX deployment (max 15 min)..."
          for i in $(seq 1 60); do
            if kubectl get deployment awx -n "$NAMESPACE" &>/dev/null; then
              echo "AWX deployment found."
              kubectl rollout status deployment/awx --namespace="$NAMESPACE" --timeout=300s || true
              break
            fi
            echo "[$i/60] Waiting for AWX deployment to be created..."
            sleep 15
          done

      - name: Run health check
        if: needs.set-environment.outputs.dry_run != 'true'
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          NAMESPACE="awx-${ENV}"

          echo "=== Pods in $NAMESPACE ==="
          kubectl get pods -n "$NAMESPACE"
          echo ""
          echo "=== Services in $NAMESPACE ==="
          kubectl get svc -n "$NAMESPACE"
          echo ""
          echo "=== AWX CR Status ==="
          kubectl get awx -n "$NAMESPACE" -o yaml | grep -A 20 'status:' || true

      - name: Deployment summary
        if: always()
        run: |
          ENV="${{ needs.set-environment.outputs.environment }}"
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | $ENV |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Namespace | awx-$ENV |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | ${{ github.sha }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry Run | ${{ needs.set-environment.outputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
