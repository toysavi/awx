name: Deploy AWX

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'uat'
        type: choice
        options: [uat, prod]

env:
  KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}

jobs:
  validate:
    name: Validate Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Validate AWX instance YAML
        run: |
          kubectl apply --dry-run=client -f k8s/awx/awx-instance.yaml || true

  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'uat' }}
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ github.event.inputs.environment || 'uat' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Install Helm
        uses: azure/setup-helm@v3

      - name: Deploy AWX Operator
        run: |
          helm repo add awx-operator https://ansible-community.github.io/awx-operator-helm/
          helm repo update
          helm upgrade --install awx-operator awx-operator/awx-operator \
            --namespace awx \
            --create-namespace \
            -f k8s/operator/values.yaml \
            --wait --timeout=5m

      - name: Deploy AWX Instance
        run: |
          # Replace hostname placeholder with actual value
          sed "s/REPLACE_WITH_IP/${{ secrets.SERVER_IP }}/g" \
            k8s/awx/awx-instance.yaml | kubectl apply -f -

      - name: Wait for AWX to be ready
        run: |
          kubectl wait --for=condition=Ready pods \
            -l app.kubernetes.io/name=awx-web \
            -n awx --timeout=600s

      - name: Health check
        run: |
          chmod +x scripts/healthcheck.sh
          bash scripts/healthcheck.sh

      - name: Get AWX URL
        run: |
          echo "AWX URL: https://awx.${{ secrets.SERVER_IP }}.nip.io"
          kubectl get secret awx-admin-password -n awx \
            -o jsonpath="{.data.password}" | base64 -d && echo
