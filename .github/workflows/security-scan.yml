# .github/workflows/security-scan.yml
# ============================================================
# Scheduled security scanning pipeline.
# Runs weekly and on every push to catch CVEs in images
# and misconfigurations in manifests.
# ============================================================
name: Security Scan

on:
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 UTC
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trivy-image-scan:
    name: Trivy Image CVE Scan
    runs-on: ubuntu-latest

    strategy:
      matrix:
        image:
          - quay.io/ansible/awx:24.6.1
          - postgres:15-alpine

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan image for CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: trivy-${{ strategy.job-index }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-${{ strategy.job-index }}.sarif
        if: always()

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
