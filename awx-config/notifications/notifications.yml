---
# AWX Notification Templates
# Applied by: ansible-playbook awx-config/scripts/configure-all.yml --tags notifications

notification_templates:

  # ── Telegram ───────────────────────────────────────────
  - name: "Telegram - Ops Alerts"
    description: "Telegram notifications for ops team"
    organization: "PhillipBank"
    notification_type: "webhook"
    configuration:
      url: "https://api.telegram.org/botREPLACE_BOT_TOKEN/sendMessage"
      http_method: "POST"
      headers:
        Content-Type: "application/json"
      body: |
        {
          "chat_id": "REPLACE_CHAT_ID",
          "parse_mode": "HTML",
          "text": "{{ '{{' }} if job.status == 'successful' {{ '}}' }}<b>✅ AWX Job Succeeded</b>{{ '{{' }} else {{ '}}' }}<b>❌ AWX Job Failed</b>{{ '{{' }} end {{ '}}' }}\n\n<b>Job:</b> {{ '{{' }} job.name {{ '}}' }}\n<b>Status:</b> {{ '{{' }} job.status {{ '}}' }}\n<b>Started:</b> {{ '{{' }} job.started {{ '}}' }}\n<b>Finished:</b> {{ '{{' }} job.finished {{ '}}' }}\n<b>URL:</b> {{ '{{' }} url {{ '}}' }}"
        }

  # ── Telegram — Started ─────────────────────────────────
  - name: "Telegram - Job Started"
    description: "Notify when job starts"
    organization: "PhillipBank"
    notification_type: "webhook"
    configuration:
      url: "https://api.telegram.org/botREPLACE_BOT_TOKEN/sendMessage"
      http_method: "POST"
      headers:
        Content-Type: "application/json"
      body: |
        {
          "chat_id": "REPLACE_CHAT_ID",
          "parse_mode": "HTML",
          "text": "🚀 <b>AWX Job Started</b>\n\n<b>Job:</b> {{ '{{' }} job.name {{ '}}' }}\n<b>Inventory:</b> {{ '{{' }} job.summary_fields.inventory.name {{ '}}' }}\n<b>Launched by:</b> {{ '{{' }} job.summary_fields.created_by.username {{ '}}' }}"
        }

  # ── Email ──────────────────────────────────────────────
  - name: "Email - Ops Team"
    description: "Email notifications to ops team"
    organization: "PhillipBank"
    notification_type: "email"
    configuration:
      host: "smtp.phillipbank.com.kh"
      port: 587
      username: "awx-notify@phillipbank.com.kh"
      password: "REPLACE_WITH_SMTP_PASSWORD"
      use_tls: true
      use_ssl: false
      sender: "awx-notify@phillipbank.com.kh"
      recipients:
        - "ops@phillipbank.com.kh"
      subject: "AWX: {{ '{{' }} job.status | upper {{ '}}' }} — {{ '{{' }} job.name {{ '}}' }}"
      body: |
        AWX Job Notification

        Job Name:   {{ '{{' }} job.name {{ '}}' }}
        Status:     {{ '{{' }} job.status {{ '}}' }}
        Started:    {{ '{{' }} job.started {{ '}}' }}
        Finished:   {{ '{{' }} job.finished {{ '}}' }}
        URL:        {{ '{{' }} url {{ '}}' }}

        Friendly,
        AWX Automation

  # ── Slack ──────────────────────────────────────────────
  - name: "Slack - Ops Channel"
    description: "Slack notifications to #ops-alerts channel"
    organization: "PhillipBank"
    notification_type: "slack"
    configuration:
      token: "REPLACE_WITH_SLACK_BOT_TOKEN"
      channels:
        - "#ops-alerts"
      hex_color: ""
