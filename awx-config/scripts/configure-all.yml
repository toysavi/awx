---
# AWX Configuration — Master Playbook
# Configures AWX application settings via the awx.awx Ansible collection
#
# Prerequisites:
#   pip3 install awxkit
#   ansible-galaxy collection install awx.awx
#
# Usage:
#   export CONTROLLER_HOST=https://awx.YOUR_IP.nip.io
#   export CONTROLLER_USERNAME=admin
#   export CONTROLLER_PASSWORD=your_password
#   export CONTROLLER_VERIFY_SSL=false
#
#   ansible-playbook awx-config/scripts/configure-all.yml
#   ansible-playbook awx-config/scripts/configure-all.yml --tags organizations
#   ansible-playbook awx-config/scripts/configure-all.yml --tags credentials

- name: Configure AWX
  hosts: localhost
  gather_facts: false
  collections:
    - awx.awx

  vars:
    controller_host: "{{ lookup('env', 'CONTROLLER_HOST') }}"
    controller_username: "{{ lookup('env', 'CONTROLLER_USERNAME') | default('admin') }}"
    controller_password: "{{ lookup('env', 'CONTROLLER_PASSWORD') }}"
    controller_verify_ssl: "{{ lookup('env', 'CONTROLLER_VERIFY_SSL') | default('false') | bool }}"

    config_dir: "{{ playbook_dir }}/.."

  pre_tasks:
    - name: Verify environment variables set
      assert:
        that:
          - controller_host != ""
          - controller_password != ""
        fail_msg: "Set CONTROLLER_HOST and CONTROLLER_PASSWORD environment variables"

    - name: Load organizations config
      include_vars: "{{ config_dir }}/organizations/organizations.yml"
      tags: [organizations, users, teams]

    - name: Load credentials config
      include_vars: "{{ config_dir }}/credentials/credentials.yml"
      tags: [credentials]

    - name: Load inventories config
      include_vars: "{{ config_dir }}/inventories/inventories.yml"
      tags: [inventories]

    - name: Load projects config
      include_vars: "{{ config_dir }}/projects/projects.yml"
      tags: [projects]

    - name: Load templates config
      include_vars: "{{ config_dir }}/templates/templates.yml"
      tags: [templates]

    - name: Load workflows config
      include_vars: "{{ config_dir }}/workflows/workflows.yml"
      tags: [workflows]

    - name: Load notifications config
      include_vars: "{{ config_dir }}/notifications/notifications.yml"
      tags: [notifications]

    - name: Load schedules config
      include_vars: "{{ config_dir }}/schedules/schedules.yml"
      tags: [schedules]

  tasks:

    # ── Organizations ──────────────────────────────────────
    - name: Create organizations
      awx.awx.organization:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        max_hosts: "{{ item.max_hosts | default(0) }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ organizations }}"
      tags: [organizations]

    # ── Teams ──────────────────────────────────────────────
    - name: Create teams
      awx.awx.team:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ item.organization }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ teams }}"
      tags: [organizations, teams]

    # ── Users ──────────────────────────────────────────────
    - name: Create users
      awx.awx.user:
        username: "{{ item.username }}"
        password: "{{ item.password | default(omit) }}"
        email: "{{ item.email | default('') }}"
        first_name: "{{ item.first_name | default('') }}"
        last_name: "{{ item.last_name | default('') }}"
        is_superuser: "{{ item.is_superuser | default(false) }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ users }}"
      tags: [organizations, users]

    # ── Credentials ────────────────────────────────────────
    - name: Create credentials
      awx.awx.credential:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ item.organization }}"
        credential_type: "{{ item.credential_type }}"
        inputs: "{{ item.inputs }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ credentials }}"
      tags: [credentials]

    # ── Inventories ────────────────────────────────────────
    - name: Create inventories
      awx.awx.inventory:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ item.organization }}"
        variables: "{{ item.variables | default({}) | to_json }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ inventories }}"
      tags: [inventories]

    - name: Create inventory hosts
      awx.awx.host:
        name: "{{ item.1.name }}"
        inventory: "{{ item.0.name }}"
        description: "{{ item.1.description | default('') }}"
        variables: "{{ item.1.variables | default({}) | to_json }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ inventories | subelements('hosts', skip_missing=True) }}"
      tags: [inventories]

    - name: Create inventory groups
      awx.awx.group:
        name: "{{ item.1.name }}"
        inventory: "{{ item.0.name }}"
        description: "{{ item.1.description | default('') }}"
        variables: "{{ item.1.variables | default({}) | to_json }}"
        hosts: "{{ item.1.hosts | default([]) }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ inventories | subelements('groups', skip_missing=True) }}"
      tags: [inventories]

    # ── Projects ───────────────────────────────────────────
    - name: Create projects
      awx.awx.project:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ item.organization }}"
        scm_type: "{{ item.scm_type | default('git') }}"
        scm_url: "{{ item.scm_url }}"
        scm_branch: "{{ item.scm_branch | default('main') }}"
        scm_clean: "{{ item.scm_clean | default(true) }}"
        scm_update_on_launch: "{{ item.scm_update_on_launch | default(true) }}"
        credential: "{{ item.credential | default(omit) }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ projects }}"
      tags: [projects]

    # ── Job Templates ──────────────────────────────────────
    - name: Create job templates
      awx.awx.job_template:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ item.organization }}"
        inventory: "{{ item.inventory }}"
        project: "{{ item.project }}"
        playbook: "{{ item.playbook }}"
        credentials: "{{ item.credentials | default([]) }}"
        extra_vars: "{{ item.extra_vars | default({}) | to_json }}"
        ask_variables_on_launch: "{{ item.ask_variables_on_launch | default(false) }}"
        ask_limit_on_launch: "{{ item.ask_limit_on_launch | default(false) }}"
        become_enabled: "{{ item.become_enabled | default(false) }}"
        concurrent_jobs_enabled: "{{ item.concurrent_jobs_enabled | default(false) }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ job_templates }}"
      tags: [templates]

    # ── Notifications ──────────────────────────────────────
    - name: Create notification templates
      awx.awx.notification_template:
        name: "{{ item.name }}"
        description: "{{ item.description | default('') }}"
        organization: "{{ item.organization }}"
        notification_type: "{{ item.notification_type }}"
        notification_configuration: "{{ item.configuration }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ notification_templates }}"
      tags: [notifications]

    # ── Schedules ──────────────────────────────────────────
    - name: Create schedules
      awx.awx.schedule:
        name: "{{ item.name }}"
        unified_job_template: "{{ item.job_template }}"
        rrule: "{{ item.rrule }}"
        enabled: "{{ item.enabled | default(true) }}"
        state: present
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_verify_ssl }}"
      loop: "{{ schedules }}"
      tags: [schedules]
