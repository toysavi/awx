---
credentials:

  # ── SSH Machine Credential ──────────────────────────────
  - name: "SSH - Linux Servers"
    description: "SSH key for Linux server access"
    organization: "PhillipBank"
    credential_type: "Machine"
    inputs:
      username: "azureuser"
      ssh_key_data: |
        -----BEGIN OPENSSH PRIVATE KEY-----
        REPLACE_WITH_ACTUAL_PRIVATE_KEY
        -----END OPENSSH PRIVATE KEY-----

  # ── Source Control — GitHub ─────────────────────────────
  - name: "Git - GitHub"
    description: "GitHub access token"
    organization: "PhillipBank"
    credential_type: "Source Control"
    inputs:
      username: "git"
      password: "REPLACE_WITH_GITHUB_TOKEN"

  # ── Source Control — GitLab ─────────────────────────────
  - name: "Git - GitLab"
    description: "GitLab access token"
    organization: "PhillipBank"
    credential_type: "Source Control"
    inputs:
      username: "git"
      password: "REPLACE_WITH_GITLAB_TOKEN"

  # ── Azure Credentials ───────────────────────────────────
  - name: "Azure - Service Principal"
    description: "Azure service principal for cloud automation"
    organization: "PhillipBank"
    credential_type: "Microsoft Azure Resource Manager"
    inputs:
      subscription: "REPLACE_WITH_AZURE_SUBSCRIPTION_ID"
      client: "REPLACE_WITH_AZURE_CLIENT_ID"
      secret: "REPLACE_WITH_AZURE_CLIENT_SECRET"
      tenant: "REPLACE_WITH_AZURE_TENANT_ID"

  # ── Vault Credential ────────────────────────────────────
  - name: "HashiCorp Vault"
    description: "HashiCorp Vault token"
    organization: "PhillipBank"
    credential_type: "HashiCorp Vault Secret Lookup"
    inputs:
      url: "https://vault.phillipbank.com.kh"
      token: "REPLACE_WITH_VAULT_TOKEN"
      cacert: ""
      api_version: "v1"
