---
job_templates:

  # ── Infrastructure ─────────────────────────────────────
  - name: "Ping All Hosts"
    description: "Test connectivity to all hosts"
    organization: "PhillipBank"
    inventory: "UAT Environment"
    project: "Infrastructure Playbooks"
    playbook: "ping.yml"
    credentials:
      - "SSH - Linux Servers"
    become_enabled: false
    ask_limit_on_launch: true
    ask_variables_on_launch: false

  - name: "Patch - OS Updates"
    description: "Apply OS security patches"
    organization: "PhillipBank"
    inventory: "UAT Environment"
    project: "Infrastructure Playbooks"
    playbook: "patch.yml"
    credentials:
      - "SSH - Linux Servers"
    become_enabled: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    extra_vars:
      reboot_after_patch: false
      update_type: security

  - name: "Deploy - Application"
    description: "Deploy application to target servers"
    organization: "PhillipBank"
    inventory: "UAT Environment"
    project: "Application Deployment"
    playbook: "deploy.yml"
    credentials:
      - "SSH - Linux Servers"
    become_enabled: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    extra_vars:
      app_version: latest
      env: uat

  - name: "Deploy - Application (Production)"
    description: "Deploy application to production"
    organization: "PhillipBank"
    inventory: "Production Environment"
    project: "Application Deployment"
    playbook: "deploy.yml"
    credentials:
      - "SSH - Linux Servers"
    become_enabled: true
    ask_limit_on_launch: false
    ask_variables_on_launch: true
    extra_vars:
      app_version: latest
      env: prod

  - name: "Backup - Database"
    description: "Backup databases on all DB servers"
    organization: "PhillipBank"
    inventory: "UAT Environment"
    project: "Infrastructure Playbooks"
    playbook: "backup-db.yml"
    credentials:
      - "SSH - Linux Servers"
    become_enabled: true
    ask_limit_on_launch: false
    ask_variables_on_launch: false
    extra_vars:
      backup_dest: /var/backups/db
      retention_days: 7

  - name: "AWX - Self Configure"
    description: "Apply AWX config-as-code from this repo"
    organization: "PhillipBank"
    inventory: "UAT Environment"
    project: "AWX Config as Code"
    playbook: "awx-config/scripts/configure-all.yml"
    credentials:
      - "SSH - Linux Servers"
    become_enabled: false
    ask_variables_on_launch: true
    extra_vars:
      controller_verify_ssl: false
