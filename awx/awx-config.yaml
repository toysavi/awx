# awx/awx-config.yaml
# ============================================================
# AWX Application Configuration Reference
# This documents the AWX settings configured via the operator.
# Actual values are set in k8s/base/awx/awx-instance.yaml
# and environment overlays.
# ============================================================

# AWX Version Information
awx_version: "24.6.1"
operator_version: "2.19.1"

# Default Project: links AWX to this GitHub repository
# Create this Project in AWX UI after deployment:
default_project:
  name: "AWX GitOps Playbooks"
  description: "Ansible playbooks from the awx-gitops GitHub repository"
  scm_type: git
  scm_url: "https://github.com/YOUR_ORG/awx-gitops.git"
  scm_branch: main
  scm_update_on_launch: true
  scm_clean: true
  # For private repos, create a Credential in AWX UI first
  # credential: github-token

# Default Credentials (create these in AWX UI)
credentials:
  - name: "GitHub Token"
    type: "Source Control"
    description: "GitHub PAT for pulling playbooks from private repos"

  - name: "Target SSH Key"
    type: "Machine"
    description: "SSH key for connecting to managed hosts"

# Default Inventories
inventories:
  - name: "Dev Inventory"
    description: "Development environment hosts"
    source: "SCM"
    source_path: "ansible/inventories/dev"

  - name: "Prod Inventory"
    description: "Production environment hosts"
    source: "SCM"
    source_path: "ansible/inventories/prod"

# Default Job Templates
job_templates:
  - name: "Deploy Application"
    playbook: "ansible/playbooks/site.yml"
    inventory: "Dev Inventory"
    ask_inventory_on_launch: true
    ask_limit_on_launch: true

  - name: "Configure AWX"
    playbook: "ansible/playbooks/configure-awx.yml"
    inventory: "Dev Inventory"
